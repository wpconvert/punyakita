<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10Fast Mode</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(0, 255, 255, 0.14), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 110, 255, 0.18), transparent 35%),
        #07111f;
      color: #eaf6ff;
      padding: 22px;
      overflow-x: auto;
    }

    .app {
      width: 820px;
      max-width: 820px;
      min-width: 820px;
      margin: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding: 18px 20px;
      background: rgba(10, 25, 45, 0.9);
      border: 1px solid rgba(80, 170, 255, 0.25);
      border-radius: 18px;
      box-shadow: 0 0 28px rgba(0, 174, 255, 0.12);
    }

    .brand h1 {
      color: #64dfff;
      font-size: 26px;
      margin-bottom: 4px;
    }

    .brand p {
      color: #9db7cc;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    button {
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #009dff, #00e0ff);
      box-shadow: 0 8px 18px rgba(0, 157, 255, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 224, 255, 0.35);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff4d6d, #ff8a00);
    }

    .game-panel {
      background: rgba(10, 25, 45, 0.9);
      border: 1px solid rgba(80, 170, 255, 0.25);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 0 30px rgba(0, 174, 255, 0.12);
    }

    .mini-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: nowrap;
    }

    .mini-pill {
      padding: 9px 13px;
      border-radius: 10px;
      background: rgba(100, 223, 255, 0.12);
      border: 1px solid rgba(100, 223, 255, 0.25);
      color: #dff8ff;
      font-size: 13px;
      white-space: nowrap;
    }

    .language-btn {
      padding: 9px 13px;
      border-radius: 10px;
      background: linear-gradient(135deg, #21b96f, #4be08e);
      color: white;
      font-weight: bold;
      white-space: nowrap;
    }

    .text-box {
      height: 134px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid rgba(100, 223, 255, 0.35);
      padding: 18px 20px;
      font-size: 23px;
      color: #233142;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .text-line {
      height: 48px;
      line-height: 48px;
      white-space: nowrap;
      overflow: hidden;
    }

    .word {
      display: inline-block;
      margin: 0 11px 0 0;
      padding: 1px 5px;
      border-radius: 6px;
      color: #263747;
    }

    .word.active {
      background: #d9efff;
      color: #0078c9;
    }

    .word.correct {
      color: #12a060;
      background: #dfffea;
    }

    .word.wrong {
      color: #d6324b;
      background: #ffe0e6;
    }

    .letter-correct {
      color: #12a060;
    }

    .letter-wrong {
      color: #d6324b;
    }

    .input-row {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 90px 58px;
      gap: 10px;
      background: rgba(100, 223, 255, 0.12);
      border: 1px solid rgba(100, 223, 255, 0.22);
      border-radius: 14px;
      padding: 12px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 8px;
      border: 2px solid #b7c7d9;
      background: white;
      color: #111827;
      outline: none;
      font-size: 22px;
      font-weight: bold;
    }

    input:focus {
      border-color: #00b9ff;
      box-shadow: 0 0 0 3px rgba(0, 185, 255, 0.15);
    }

    input:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }

    .timer-box {
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      background: #344861;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }

    .reset-btn {
      border-radius: 8px;
      background: #238bd6;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .result {
      margin-top: 18px;
      display: none;
      background: rgba(4, 15, 30, 0.75);
      border: 1px solid rgba(100, 223, 255, 0.18);
      border-radius: 18px;
      padding: 18px;
    }

    .result h2 {
      color: #64dfff;
      margin-bottom: 14px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: rgba(10, 25, 45, 0.9);
      border: 1px solid rgba(100, 223, 255, 0.16);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
    }

    .stat-box strong {
      display: block;
      color: #64dfff;
      font-size: 26px;
      margin-bottom: 4px;
    }

    .stat-box span {
      color: #9db7cc;
      font-size: 12px;
    }

    .small-note {
      color: #9db7cc;
      font-size: 13px;
      margin-top: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <h1>10FastFingers Mode</h1>
        <p>Ketik kata sebanyak mungkin dalam 60 detik.</p>
      </div>

      <div class="top-actions">
        <button class="btn btn-danger" onclick="goBack()">Kembali Lobby</button>
      </div>
    </div>

    <div class="game-panel">
      <div class="mini-bar">
        <div class="mini-pill" id="playerName">Player: Guest</div>
        <button class="language-btn">Indonesia</button>
        <div class="mini-pill">Timer mulai saat kamu mengetik</div>
      </div>

      <div class="text-box" id="wordBox">
        <div class="text-line" id="lineOne"></div>
        <div class="text-line" id="lineTwo"></div>
      </div>

      <div class="input-row">
        <input type="text" id="typingInput" placeholder="Ketik di sini..." autocomplete="off" />
        <div class="timer-box" id="timer">1:00</div>
        <button class="reset-btn" onclick="resetGame()">↻</button>
      </div>

      <div class="result" id="resultBox">
        <h2>Hasil Test</h2>

        <div class="result-grid">
          <div class="stat-box">
            <strong id="resultWpm">0</strong>
            <span>WPM</span>
          </div>

          <div class="stat-box">
            <strong id="resultAccuracy">0%</strong>
            <span>Akurasi</span>
          </div>

          <div class="stat-box">
            <strong id="resultCorrect">0</strong>
            <span>Kata Benar</span>
          </div>

          <div class="stat-box">
            <strong id="resultWrong">0</strong>
            <span>Kata Salah</span>
          </div>
        </div>

        <p class="small-note">
          Nanti hasil ini bisa kita sambungkan ke GAS untuk menambahkan EXP akun login.
        </p>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "typingRaceUser";

    const words = [
      "aku","kamu","dia","kita","mereka","rumah","jalan","cepat","lambat","besar",
      "kecil","main","makan","minum","tidur","belajar","bekerja","teman","waktu","hari",
      "malam","pagi","siang","sore","mobil","motor","hujan","panas","dingin","angin",
      "laut","gunung","kota","desa","pasar","uang","buku","meja","kursi","pintu",
      "komputer","keyboard","layar","internet","permainan","mengetik","balapan","level","skin","akun",
      "angka","huruf","kata","kalimat","benar","salah","hasil","nilai","fokus","target",
      "latihan","juara","lawan","acak","ruangan","timer","mode","skor","peringkat","dunia",
      "server","login","daftar","tamu","profil","pengalaman","cahaya","gelap","warna","suara",
      "musik","gambar","tombol","halaman","website","script","admin","data","online","offline",
      "mulai","selesai","menang","kalah","akurasi","kecepatan","bahasa","pilihan","ulang","tantangan",
      "mudah","sulit","sedang","panjang","pendek","cerita","sekolah","kantor","keluarga","anak",
      "orang","tempat","mimpi","rasa","hidup","baru","lama","dekat","jauh","bawah",
      "atas","kanan","kiri","depan","belakang","tengah","membawa","memasak","membaca","menulis",
      "mencari","melihat","berlari","berjalan","bermain","mendengar","membuka","menutup","mengambil","memberi"
    ];

    let lineOneWords = [];
    let lineTwoWords = [];
    let currentIndex = 0;
    let correctWords = 0;
    let wrongWords = 0;
    let totalTyped = 0;
    let correctChars = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let isRunning = false;
    let isFinished = false;

    const input = document.getElementById("typingInput");

    document.addEventListener("DOMContentLoaded", () => {
      loadPlayer();
      resetGame();
      input.focus();
    });

    input.addEventListener("input", () => {
      if (isFinished) return;

      if (!isRunning && input.value.length > 0) {
        startTimer();
      }

      if (input.value.endsWith(" ")) {
        checkWord(input.value.trim());
        input.value = "";
      }

      renderLines();
    });

    function loadPlayer() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        document.getElementById("playerName").textContent = "Player: Guest";
        return;
      }

      const user = JSON.parse(saved);
      document.getElementById("playerName").textContent = "Player: " + (user.displayName || user.username || "Guest");
    }

    function makeLine() {
      const arr = [];

      for (let i = 0; i < 7; i++) {
        arr.push({
          text: words[Math.floor(Math.random() * words.length)],
          status: ""
        });
      }

      return arr;
    }

    function renderLines() {
      renderLine("lineOne", lineOneWords, true);
      renderLine("lineTwo", lineTwoWords, false);
    }

    function renderLine(id, list, isTopLine) {
      const el = document.getElementById(id);
      el.innerHTML = "";

      list.forEach((item, i) => {
        const span = document.createElement("span");
        span.className = "word";

        if (item.status === "correct") {
          span.classList.add("correct");
        }

        if (item.status === "wrong") {
          span.classList.add("wrong");
        }

        if (isTopLine && i === currentIndex) {
          span.classList.add("active");
          span.innerHTML = renderActiveWord(item.text, input.value.trim());
        } else {
          span.textContent = item.text;
        }

        el.appendChild(span);
      });
    }

    function renderActiveWord(word, typed) {
      let html = "";

      for (let i = 0; i < word.length; i++) {
        const letter = word[i];

        if (i < typed.length) {
          if (typed[i] === letter) {
            html += '<span class="letter-correct">' + escapeHtml(letter) + "</span>";
          } else {
            html += '<span class="letter-wrong">' + escapeHtml(letter) + "</span>";
          }
        } else {
          html += escapeHtml(letter);
        }
      }

      if (typed.length > word.length) {
        for (let i = word.length; i < typed.length; i++) {
          html += '<span class="letter-wrong">' + escapeHtml(typed[i]) + "</span>";
        }
      }

      return html;
    }

    function startTimer() {
      isRunning = true;

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) {
          finishGame();
        }
      }, 1000);
    }

    function checkWord(typedWord) {
      if (!typedWord || isFinished) return;

      const target = lineOneWords[currentIndex];
      totalTyped++;

      if (typedWord === target.text) {
        target.status = "correct";
        correctWords++;
        correctChars += target.text.length;
      } else {
        target.status = "wrong";
        wrongWords++;
      }

      currentIndex++;

      if (currentIndex >= lineOneWords.length) {
        lineOneWords = lineTwoWords;
        lineTwoWords = makeLine();
        currentIndex = 0;
      }
    }

    function updateTimer() {
      const minute = Math.floor(timeLeft / 60);
      const second = timeLeft % 60;
      document.getElementById("timer").textContent = minute + ":" + String(second).padStart(2, "0");
    }

    function finishGame() {
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      isFinished = true;

      input.blur();
      input.disabled = true;

      const wpm = Math.round(correctChars / 5);
      const accuracy = totalTyped > 0 ? Math.round((correctWords / totalTyped) * 100) : 0;

      document.getElementById("resultWpm").textContent = wpm;
      document.getElementById("resultAccuracy").textContent = accuracy + "%";
      document.getElementById("resultCorrect").textContent = correctWords;
      document.getElementById("resultWrong").textContent = wrongWords;
      document.getElementById("resultBox").style.display = "block";
    }

    function resetGame() {
      clearInterval(timerInterval);
      timerInterval = null;

      lineOneWords = makeLine();
      lineTwoWords = makeLine();
      currentIndex = 0;
      correctWords = 0;
      wrongWords = 0;
      totalTyped = 0;
      correctChars = 0;
      timeLeft = 60;
      isRunning = false;
      isFinished = false;

      input.value = "";
      input.disabled = false;

      updateTimer();
      renderLines();

      document.getElementById("resultBox").style.display = "none";

      setTimeout(() => {
        input.focus();
      }, 50);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
