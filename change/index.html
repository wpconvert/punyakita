<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ubah Skin</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

    body{
      background:#07111f;
      color:#eaf6ff;
      padding:20px;
      overflow-x:hidden;
    }

    .app{
      width:100%;
      max-width:1300px;
      margin:auto;
    }

    .topbar{
      text-align:center;
      margin-bottom:20px;
      padding:15px;
      background:#0a192d;
      border-radius:12px;
    }

    .topbar h1{
      color:#64dfff;
      margin-bottom:10px;
    }

    .btn{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      background:#009dff;
      font-weight:bold;
    }

    .btn-danger{background:#ff4d6d}

    /* === LAYOUT KIRI KANAN FIX === */
    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:20px;
    }

    .card{
      background:#0a192d;
      padding:20px;
      border-radius:12px;
      min-width:0;
    }

    .card h2{
      color:#64dfff;
      margin-bottom:10px;
    }

    .skin-list{
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:12px;
    }

    .skin-card{
      text-align:center;
      padding:15px;
      background:#041020;
      border-radius:10px;
      cursor:pointer;
    }

    .skin-card.active{
      outline:2px solid #4dffb8;
    }

    .skin-image{
      font-size:40px;
      margin-bottom:8px;
    }

    .skin-image img{
      width:80px;
      object-fit:contain;
    }

    .preview-area{
      text-align:center;
      margin-top:15px;
    }

    .road{
      height:80px;
      border-bottom:2px dashed #f0b629;
      position:relative;
      margin-bottom:15px;
    }

    .preview-car{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:10px;
      font-size:50px;
    }

    .preview-car img{
      width:100px;
    }

    .notice{
      margin-top:10px;
      color:#4dffb8;
      text-align:center;
    }

  </style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <h1>UBAH SKIN</h1>
    <button class="btn btn-danger" onclick="goLobby()">Kembali Lobby</button>
  </div>

  <div class="grid">

    <!-- KIRI -->
    <div class="card">
      <h2>Pilihan Skin</h2>

      <div class="skin-list" id="skinList"></div>
    </div>

    <!-- KANAN -->
    <div class="card">
      <h2>Skin Dipakai</h2>

      <div class="preview-area">

        <div class="road">
          <div class="preview-car" id="previewCar">🏎️</div>
        </div>

        <h3 id="previewName">Default</h3>
        <p id="previewDesc">Skin awal</p>

      </div>

      <div class="notice" id="notice"></div>

      <button class="btn" onclick="useSkin()">Pakai Skin</button>
    </div>

  </div>
</div>

<script>

const SELECTED_SKIN_KEY = "selectedTypingSkin";

const skins = [
  {id:"default",name:"Default",desc:"Skin awal",type:"emoji",value:"🏎️"},
  {id:"red",name:"Merah",desc:"Mobil merah",type:"emoji",value:"🚗"},
  {id:"green",name:"Hijau",desc:"Mobil hijau",type:"emoji",value:"🚙"}
];

let selectedSkinId = localStorage.getItem(SELECTED_SKIN_KEY) || "default";

renderSkins();
renderPreview();

function renderSkins(){
  const list=document.getElementById("skinList");
  list.innerHTML="";

  skins.forEach(s=>{
    const el=document.createElement("div");
    el.className="skin-card"+(s.id===selectedSkinId?" active":"");
    el.onclick=()=>selectSkin(s.id);

    el.innerHTML=`
      <div class="skin-image">${renderSkin(s)}</div>
      <h4>${s.name}</h4>
    `;

    list.appendChild(el);
  });
}

function selectSkin(id){
  selectedSkinId=id;
  renderSkins();
  renderPreview();
}

function renderPreview(){
  const s=getSkin();
  document.getElementById("previewCar").innerHTML=renderSkin(s);
  document.getElementById("previewName").textContent=s.name;
  document.getElementById("previewDesc").textContent=s.desc;
}

function renderSkin(s){
  if(s.type==="image") return `<img src="${s.value}">`;
  return s.value;
}

function useSkin(){
  localStorage.setItem(SELECTED_SKIN_KEY,selectedSkinId);
  document.getElementById("notice").textContent="Skin dipakai ✓";
}

function getSkin(){
  return skins.find(s=>s.id===selectedSkinId);
}

function goLobby(){
  window.location.href="https://wpconvert.github.io/punyakita/lobby/index.html";
}

</script>

</body>
</html>
