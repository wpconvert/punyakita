<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ubah Skin</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

    body{
      background:#07111f;
      color:#eaf6ff;
      padding:20px;
      overflow-x:hidden;
    }

    .app{
      width:100%;
      max-width:1300px;
      margin:auto;
    }

    .topbar{
      text-align:center;
      margin-bottom:20px;
      padding:15px;
      background:#0a192d;
      border-radius:12px;
    }

    .topbar h1{
      color:#64dfff;
      margin-bottom:10px;
    }

    .btn{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      background:#009dff;
      font-weight:bold;
    }

    .btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .btn-danger{background:#ff4d6d}

    .grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:20px;
    }

    .card{
      background:#0a192d;
      padding:20px;
      border-radius:12px;
      min-width:0;
    }

    .card h2{
      color:#64dfff;
      margin-bottom:10px;
    }

    .skin-list{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .skin-card{
      position:relative;
      text-align:center;
      padding:15px;
      background:#041020;
      border-radius:10px;
      cursor:pointer;
      min-height:130px;
      overflow:hidden;
      border:1px solid rgba(100,223,255,.15);
    }

    .skin-card.active{
      outline:2px solid #4dffb8;
    }

    .skin-card.locked{
      opacity:.75;
    }

    .skin-lock{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.42);
      font-size:34px;
      z-index:2;
    }

    .skin-level{
      margin-top:6px;
      font-size:12px;
      color:#9db7cc;
    }

    .skin-image{
      font-size:40px;
      margin-bottom:8px;
      height:70px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .skin-image img{
      width:90px;
      max-height:65px;
      object-fit:contain;
      image-rendering:pixelated;
      display:block;
    }

    .preview-area{
      text-align:center;
      margin-top:15px;
    }

    .road{
      height:90px;
      border-bottom:2px dashed #f0b629;
      position:relative;
      margin-bottom:15px;
      overflow:hidden;
    }

    .preview-car{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:10px;
      font-size:50px;
    }

    .preview-car img{
      width:120px;
      max-height:75px;
      object-fit:contain;
      image-rendering:pixelated;
      display:block;
    }

    .notice{
      margin-top:10px;
      min-height:20px;
      color:#4dffb8;
      text-align:center;
      font-size:14px;
    }

    .notice.error{
      color:#ff6b8a;
    }
  </style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <h1>UBAH SKIN</h1>
    <button class="btn btn-danger" onclick="goLobby()">Kembali Lobby</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Pilihan Skin</h2>
      <div class="skin-list" id="skinList"></div>
    </div>

    <div class="card">
      <h2>Skin Dipakai</h2>

      <div class="preview-area">
        <div class="road">
          <div class="preview-car" id="previewCar">🏎</div>
        </div>

        <h3 id="previewName">Default</h3>
        <p id="previewDesc">Skin awal</p>
      </div>

      <div class="notice" id="notice"></div>

      <button class="btn" id="useBtn" onclick="useSkin()">Pakai Skin</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "typingRaceUser";
const SELECTED_SKIN_KEY = "selectedTypingSkin";
const SKIN_GAS_URL = "https://script.google.com/macros/s/AKfycbwxbDTMY3rAT7-6RdtutUfeOjVf0SKb6L-Ztfp6cK4AUuq4ziiOD65c-EqZk9LwJrM/exec";

let skins = [];
let selectedSkinId = localStorage.getItem(SELECTED_SKIN_KEY) || "";
let userLevel = getUserLevel();

document.addEventListener("DOMContentLoaded", () => {
  loadSkins();
});

async function loadSkins(){
  const list=document.getElementById("skinList");
  list.innerHTML="<p style='color:#9db7cc;'>Memuat skin...</p>";

  try{
    const res=await fetch(SKIN_GAS_URL+"?action=skins&t="+Date.now());
    const data=await res.json();

    console.log("DATA GAS SKIN:", data);

    if(data.status==="success" && Array.isArray(data.data)){
      skins=data.data
        .map(normalizeSkin)
        .filter(s => String(s.status || "ACTIVE").toUpperCase() === "ACTIVE");

      if(!skins.length){
        list.innerHTML="<p style='color:#ff6b8a;'>Skin kosong di GAS.</p>";
        return;
      }

      const savedUser=getSavedUser();
      const savedSkinId=savedUser.selectedSkinId || savedUser.skinId || savedUser.selectedSkin || savedUser.skin || "";

      if(savedSkinId){
        selectedSkinId=savedSkinId;
      }

      if(!skins.find(s=>s.skinId===selectedSkinId)){
        selectedSkinId=skins[0].skinId;
      }

      renderSkins();
      renderPreview();
    }else{
      list.innerHTML="<p style='color:#ff6b8a;'>Gagal memuat skin.</p>";
    }
  }catch(err){
    console.log("Gagal connect ke GAS SKIN:",err);
    list.innerHTML="<p style='color:#ff6b8a;'>Gagal connect ke GAS SKIN.</p>";
  }
}

function normalizeSkin(raw){
  const obj={};

  Object.keys(raw || {}).forEach(key=>{
    obj[String(key).toLowerCase().trim()] = raw[key];
  });

  const skinId = String(obj.skinid || raw.skinId || raw.id || "").trim();
  const skinName = String(obj.skinname || raw.skinName || raw.name || skinId).trim();
  const type = String(obj.type || raw.type || "").trim();
  const status = String(obj.status || raw.status || "ACTIVE").trim();

  let imageUrl = String(
    obj.imageurl ||
    obj.image ||
    obj.img ||
    obj.url ||
    obj.value ||
    raw.imageUrl ||
    raw.image ||
    raw.value ||
    ""
  ).trim();

  if(!imageUrl){
    Object.keys(raw || {}).forEach(key=>{
      const val=String(raw[key] || "").trim();
      if(!imageUrl && val.startsWith("http")){
        imageUrl=val;
      }
    });
  }

  let unlockLevel = Number(
    obj.unlocklevel ||
    obj.level ||
    raw.unlockLevel ||
    raw.level ||
    ""
  );

  if(!unlockLevel || isNaN(unlockLevel)){
    const levelMatch = type.match(/\d+/);
    unlockLevel = levelMatch ? Number(levelMatch[0]) : 1;
  }

  return {
    skinId,
    skinName,
    type,
    imageUrl,
    unlockLevel,
    status
  };
}

function getUserLevel(){
  try{
    const user=JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    return Number(user.level || user.Level || 1);
  }catch(err){
    return 1;
  }
}

function getSavedUser(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(err){
    return {};
  }
}

function renderSkins(){
  const list=document.getElementById("skinList");
  list.innerHTML="";

  skins.forEach(s=>{
    const locked=isLocked(s);
    const el=document.createElement("div");

    el.className="skin-card"+(s.skinId===selectedSkinId?" active":"")+(locked?" locked":"");
    el.onclick=()=>selectSkin(s.skinId);

    el.innerHTML=`
      <div class="skin-image">${renderSkin(s)}</div>
      <h4>${escapeHtml(s.skinName || s.skinId)}</h4>
      <div class="skin-level">Level ${s.unlockLevel}</div>
      ${locked ? '<div class="skin-lock">🔒</div>' : ''}
    `;

    list.appendChild(el);
  });
}

function selectSkin(id){
  selectedSkinId=id;
  renderSkins();
  renderPreview();

  const notice=document.getElementById("notice");
  notice.textContent="";
  notice.className="notice";
}

function renderPreview(){
  const s=getSkin();

  if(!s) return;

  document.getElementById("previewCar").innerHTML=renderSkin(s);
  document.getElementById("previewName").textContent=s.skinName || s.skinId;
  document.getElementById("previewDesc").textContent=s.type || "";

  const useBtn=document.getElementById("useBtn");

  if(isLocked(s)){
    useBtn.disabled=true;
    document.getElementById("notice").textContent="Skin terkunci. Butuh Level "+s.unlockLevel+".";
    document.getElementById("notice").className="notice error";
  }else{
    useBtn.disabled=false;
  }
}

function renderSkin(s){
  if(s.imageUrl){
    return `<img src="${s.imageUrl}" alt="" onerror="this.outerHTML='🏎'">`;
  }

  return "🏎";
}

function useSkin(){
  const s=getSkin();

  if(!s) return;

  const notice=document.getElementById("notice");

  if(isLocked(s)){
    notice.textContent="Skin terkunci. Butuh Level "+s.unlockLevel+".";
    notice.className="notice error";
    return;
  }

  selectedSkinId=s.skinId;
  localStorage.setItem(SELECTED_SKIN_KEY,selectedSkinId);

  let user=getSavedUser();

  user.skinId=s.skinId;
  user.selectedSkin=s.skinId;
  user.selectedSkinId=s.skinId;
  user.skinImage=s.imageUrl;
  user.selectedSkinImage=s.imageUrl;

  localStorage.setItem(STORAGE_KEY,JSON.stringify(user));

  notice.textContent="Skin dipakai ✓";
  notice.className="notice";

  renderSkins();
  renderPreview();
}

function isLocked(s){
  return userLevel < Number(s.unlockLevel || 1);
}

function getSkin(){
  return skins.find(s=>s.skinId===selectedSkinId) || skins[0];
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function goLobby(){
  window.location.href="https://wpconvert.github.io/punyakita/lobby/index.html";
}
</script>

</body>
</html>
