<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ubah Skin</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

    .skin-loading{
      color:#9db7cc;
      font-size:14px;
      animation:pulseText 1s infinite;
    }

    @keyframes pulseText{
      0%,100%{opacity:.4}
      50%{opacity:1}
    }

    body{
      background:#07111f;
      color:#eaf6ff;
      padding:20px;
    }

    .app{max-width:1200px;margin:auto}

    .grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}

    .card{background:#0a192d;padding:20px;border-radius:12px}

    .skin-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

    .skin-card{
      padding:10px;
      background:#041020;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }

    .skin-card.active{outline:2px solid #4dffb8}

    .skin-image img{
      width:80px;
      height:60px;
      object-fit:contain;
    }

    .preview-car{
      height:90px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .preview-car img{
      width:120px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="grid">

    <div class="card">
      <h2>Pilihan Skin</h2>
      <div id="skinList" class="skin-list"></div>
    </div>

    <div class="card">
      <h2>Skin Dipakai</h2>

      <div class="preview-car" id="previewCar">
        <span class="skin-loading">Loading skin...</span>
      </div>

      <h3 id="previewName">Memuat...</h3>

      <button onclick="useSkin()">Pakai Skin</button>
    </div>

  </div>

</div>

<script>
const SKIN_GAS_URL = "https://script.google.com/macros/s/AKfycbzaV9UAd0p3a-IdlhXvhnPp4wU7vZLXE7nmbiPOSovAhe_uSbEKUQQ5foCUVVaIbWQBtQ/exec";
const STORAGE_KEY = "typingRaceUser";

let skins = [];
let selectedSkinId = "";

document.addEventListener("DOMContentLoaded", loadSkins);

async function loadSkins(){

  document.getElementById("previewCar").innerHTML =
    '<span class="skin-loading">Loading skin...</span>';

  try{
    const res = await fetch(SKIN_GAS_URL + "?t=" + Date.now());
    const json = await res.json();

    skins = json.data;

    let user = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    selectedSkinId =
      user.skinId ||
      localStorage.getItem("selectedTypingSkin") ||
      skins[0].skinId;

    renderSkins();
    renderPreview();

  }catch(e){
    console.log(e);
  }
}

function renderSkins(){
  const list = document.getElementById("skinList");
  list.innerHTML = "";

  skins.forEach(s => {

    const el = document.createElement("div");
    el.className = "skin-card" + (s.skinId === selectedSkinId ? " active" : "");

    el.onclick = () => {
      selectedSkinId = s.skinId;
      renderSkins();
      renderPreview();
    };

    el.innerHTML = `
      <div class="skin-image">
        ${s.imageUrl ? `<img src="${s.imageUrl}">` : "🏎"}
      </div>
      <div>${s.skinName}</div>
    `;

    list.appendChild(el);
  });
}

function renderPreview(){
  const s = skins.find(x => x.skinId === selectedSkinId);
  if(!s) return;

  if(s.imageUrl){
    document.getElementById("previewCar").innerHTML =
      `<img src="${s.imageUrl}">`;
  }else{
    document.getElementById("previewCar").innerHTML = "🏎";
  }

  document.getElementById("previewName").textContent = s.skinName;
}

function useSkin(){
  const s = skins.find(x => x.skinId === selectedSkinId);
  if(!s) return;

  let user = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  user.skinId = s.skinId;
  user.skinImage = s.imageUrl;

  localStorage.setItem(STORAGE_KEY, JSON.stringify(user));

  alert("Skin dipakai ✓");
}
</script>

</body>
</html>
